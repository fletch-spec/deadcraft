// Deadcraft Fabric client: follows the Deadlock hero over the shared-memory bridge.
//   gradlew build       mod jar in build/libs (runs the tests)
//   gradlew runClient   dev client (offline account) for testing in singleplayer
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = 'deadcraft-client' }

loom {
	runs {
		client {
			// The protocol binding opens the shared memory through kernel32 (Foreign Function API).
			vmArgs '--enable-native-access=ALL-UNNAMED'
			programArgs '--username', 'DeadcraftDev'
		}
	}
}

sourceSets {
	// The Java protocol binding is compiled into the mod, so the jar has no extra dependency.
	main { java { srcDir '../protocol/java/src/main/java'; exclude 'dev/deadcraft/protocol/cli/**' } }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
	withSourcesJar()
}

jar { from('../LICENSE') { rename { "${it}_deadcraft" } } }
