# Protocol, plugin-protocol and client tests on every push and pull request.
# Windows: the protocol bindings open the shared memory through kernel32.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Generated protocol files are current
        run: python protocol/generate.py --check
      - name: C# protocol tests
        run: dotnet test protocol/csharp/tests
      - name: Java protocol tests
        run: .\protocol\java\gradlew.bat -p protocol/java test --no-daemon
      - name: Fabric client tests
        run: .\fabric-client\gradlew.bat -p fabric-client test --no-daemon
