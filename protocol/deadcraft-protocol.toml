# Deadcraft shared-memory protocol: the single source of truth.
#
# Edit this file, then run `python protocol/generate.py` to regenerate the C# and Java bindings and
# the golden fixture. `python protocol/generate.py --check` fails if anything generated is stale.
#
# Rules:
# - Everything is little-endian and fixed-size. Offsets are explicit and checked by the generator.
# - Any change to an existing field's offset, type or meaning bumps `version`. Readers refuse a
#   mapping whose magic, version or size don't match theirs.
# - Positions, velocities and angles are in Deadlock (Source 2) space: x forward, y left, z up,
#   in Source units. Convert with `units_per_block` and the axis map below; never hard-code 64.

[protocol]
magic = 0x54464344          # bytes "DCFT"
version = 7
mapping_name = 'Local\Deadcraft'
mapping_size = 262144
units_per_block = 64.0      # Source units per Minecraft block (docs/collider-test.md)

# Minecraft (x east, y up, z south) from Source (x, y, z): mc = (x, z, -y) / units_per_block.
[axes]
minecraft_x = "+source_x"
minecraft_y = "+source_z"
minecraft_z = "-source_y"

# Types: u8 i16 u32 i32 u64 f32 vec3 (3 x f32) ivec3 (3 x i32) dvec3 (3 x f64) and utf8[N] (NUL-padded UTF-8).

[[struct]]
name = "Header"
offset = 0x0
size = 0x40
doc = "Identifies the mapping and shows which sides are alive."
fields = [
  { name = "magic", type = "u32", offset = 0x00 },
  { name = "version", type = "u32", offset = 0x04 },
  { name = "mapping_size", type = "u32", offset = 0x08 },
  { name = "units_per_block", type = "f32", offset = 0x0C },
  { name = "deadlock_pid", type = "u32", offset = 0x10, doc = "deadworks.exe process id" },
  { name = "minecraft_pid", type = "u32", offset = 0x14 },
  { name = "deadlock_heartbeat_ms", type = "u64", offset = 0x18, doc = "GetTickCount64 at the plugin's last write" },
  { name = "minecraft_heartbeat_ms", type = "u64", offset = 0x20, doc = "GetTickCount64 at the client's last write" },
]

[[struct]]
name = "HeroState"
offset = 0x100
size = 0x100
seqlock = true
doc = "Deadlock -> Minecraft, written every server tick. Seqlock: seq is odd while the plugin writes."
fields = [
  { name = "seq", type = "u32", offset = 0x00 },
  { name = "flags", type = "u32", offset = 0x04, doc = "HeroFlags" },
  { name = "tick", type = "u64", offset = 0x08, doc = "Deadlock server tick count" },
  { name = "server_time", type = "f32", offset = 0x10, doc = "seconds (CurTime)" },
  { name = "hero_id", type = "u32", offset = 0x14, doc = "Deadlock Heroes enum value" },
  { name = "position", type = "vec3", offset = 0x18, doc = "feet, Source units" },
  { name = "velocity", type = "vec3", offset = 0x24, doc = "Source units per second" },
  { name = "eye_position", type = "vec3", offset = 0x30, doc = "Source units" },
  { name = "camera_angles", type = "vec3", offset = 0x3C, doc = "pitch, yaw, roll in degrees" },
  { name = "stamina", type = "f32", offset = 0x48 },
  { name = "stamina_max", type = "f32", offset = 0x4C },
  { name = "health", type = "i32", offset = 0x50 },
  { name = "health_max", type = "i32", offset = 0x54 },
  { name = "ability_event_serial", type = "u32", offset = 0x58, doc = "serial of the newest AbilityEvent" },
  { name = "recenter_serial", type = "u32", offset = 0x5C, doc = "bumps each time the plugin recentres" },
  { name = "recenter_delta", type = "vec3", offset = 0x60, doc = "Source units the hero and every collider moved in the latest recentre" },
  { name = "hull_height", type = "f32", offset = 0x6C, doc = "collision box height, Source units (shrinks when crouching or sliding)" },
  { name = "entity_flags", type = "u32", offset = 0x70, doc = "the engine's entity flag bits (on ground, ducking, ...)" },
  { name = "buttons", type = "u64", offset = 0x78, doc = "buttons the player holds (Deadlock InputButton bits: 0x1 attack, 0x800 alt fire, 0x2000 reload, 0x200000000 << n ability n+1, ...)" },
  { name = "shot_serial", type = "u32", offset = 0x80, doc = "serial of the newest Shot" },
  { name = "abilities_ready", type = "u32", offset = 0x84, doc = "bit n: signature ability n+1 is unlocked and off cooldown (a press will cast it)" },
  { name = "reload_fraction", type = "f32", offset = 0x88, doc = "while the weapon reloads (HeroFlags.reloading), how far through, 0 to 1 (-1 if unknown)" },
]

[[flags]]
name = "HeroFlags"
values = [
  { name = "present", bit = 0, doc = "a human player's hero pawn exists" },
  { name = "alive", bit = 1 },
  { name = "on_ground", bit = 2 },
  { name = "reloading", bit = 4, doc = "the primary weapon is reloading (manual or automatic, CCitadel_Ability_PrimaryWeapon.m_bInReload)" },
  { name = "channeling", bit = 3, doc = "one of the hero's signature abilities is channelling (e.g. Celeste holding her Dazzling Orb)" },
]

[[ring]]
name = "AbilityEvents"
offset = 0x200
entry = "AbilityEvent"
capacity = 32
doc = """Deadlock -> Minecraft. The plugin fills entry (serial - 1) % capacity, then sets its serial, \
then HeroState.ability_event_serial. Readers take entries newer than the last serial they saw and \
re-check the entry's serial after copying it."""

[[struct]]
name = "AbilityEvent"
size = 0x40
doc = "One ability or item use."
fields = [
  { name = "serial", type = "u32", offset = 0x00 },
  { name = "kind", type = "u32", offset = 0x04, doc = "AbilityEventKind" },
  { name = "tick", type = "u64", offset = 0x08 },
  { name = "ability_name", type = "utf8[48]", offset = 0x10, doc = "e.g. citadel_ability_..." },
]

[[enum]]
name = "AbilityEventKind"
values = [
  { name = "used", value = 1, doc = "player_used_ability" },
]

[[ring]]
name = "Shots"
offset = 0xA00
entry = "Shot"
capacity = 32
doc = """Deadlock -> Minecraft: the hero's shots as the server fires them, and where they hit. Filled like AbilityEvents, with HeroState.shot_serial."""

[[struct]]
name = "Shot"
size = 0x30
doc = "One bullet fired (origin and aim) or one impact (where it hit, and the surface normal)."
fields = [
  { name = "serial", type = "u32", offset = 0x00 },
  { name = "kind", type = "u32", offset = 0x04, doc = "ShotKind" },
  { name = "tick", type = "u64", offset = 0x08 },
  { name = "origin", type = "vec3", offset = 0x10, doc = "fired: muzzle; impact: hit point (Source units)" },
  { name = "direction", type = "vec3", offset = 0x1C, doc = "fired: pitch, yaw, roll in degrees; impact: surface normal" },
  { name = "damage", type = "u32", offset = 0x28, doc = "impact: damage dealt (0 on world geometry)" },
]

[[enum]]
name = "ShotKind"
values = [
  { name = "fired", value = 1, doc = "CMsgFireBullets" },
  { name = "impact", value = 2, doc = "CMsgBulletImpact" },
  { name = "ability_fired", value = 3, doc = "CMsgFireBullets for an ability's bullets (not the gun), e.g. Radiant Blast's cone" },
]

# ---- Minecraft -> Deadlock ---------------------------------------------------------------------

[[struct]]
name = "McState"
offset = 0x1000
size = 0x40
seqlock = true
doc = """Minecraft -> Deadlock. Seqlock: seq is odd while the client writes; the seqlock also covers the cube_count entries of Cubes. The client rewrites both only when the set changes (generation bumps)."""
fields = [
  { name = "seq", type = "u32", offset = 0x00 },
  { name = "flags", type = "u32", offset = 0x04, doc = "McFlags" },
  { name = "generation", type = "u32", offset = 0x08, doc = "bumps whenever the cube set or the offset changes" },
  { name = "cube_count", type = "u32", offset = 0x0C },
  { name = "base", type = "ivec3", offset = 0x10, doc = "Minecraft block coordinates that cube positions are relative to" },
  { name = "frame_offset", type = "dvec3", offset = 0x20, doc = "added to Minecraft block coordinates gives hero-frame blocks: source = to_source(mc + offset)" },
]

[[flags]]
name = "McFlags"
values = [
  { name = "linked", bit = 0, doc = "the client is following the hero; cubes and offset are current" },
]

[[array]]
name = "Cubes"
offset = 0x1040
entry = "Cube"
capacity = 16384
doc = "Solid space around the player as grid-aligned cubes, in half blocks. Entries 0 .. McState.cube_count - 1 are valid."

[[struct]]
name = "Cube"
size = 0x08
doc = """An axis-aligned cube of solid space. Position is its minimum corner in half blocks relative to McState.base (times 2); edge is its size in half blocks (1, 2, 4, 8 or 16) and position is a multiple of it."""
fields = [
  { name = "x", type = "i16", offset = 0x0 },
  { name = "y", type = "i16", offset = 0x2 },
  { name = "z", type = "i16", offset = 0x4 },
  { name = "edge", type = "u8", offset = 0x6, doc = "edge length in half blocks" },
]

# 0x21040 onward: free for later Minecraft -> Deadlock data (incoming damage, ability effects).
[[reserved]]
name = "Unused"
offset = 0x21040
size = 0x1EFC0
